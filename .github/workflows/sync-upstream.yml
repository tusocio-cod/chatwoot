name: Sync upstream Chatwoot

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/chatwoot/chatwoot.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream into develop
        run: |
          git merge upstream/develop --no-edit || echo "CONFLICT=true" >> $GITHUB_ENV

      - name: Push develop atualizado
        if: env.CONFLICT != 'true'
        run: git push origin develop

      - name: Abrir PR de develop para tusocio-custom
        if: env.CONFLICT != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: sync/upstream-update
          base: tusocio-custom
          title: "sync: atualizações do upstream Chatwoot"
          body: "PR automático trazendo as últimas atualizações do repositório oficial chatwoot/chatwoot para revisão antes do merge em tusocio-custom."